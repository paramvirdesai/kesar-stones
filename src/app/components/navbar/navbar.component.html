<header class="navbar" [ngClass]="headerClass">
  <nav class="corp-container navbar__inner">
    <a routerLink="/" class="navbar__brand">
      <app-logo class="text-patagonia-taupe" />
      <span class="navbar__brand-text">
        <span class="navbar__title">Iconic Stones</span>
        <span class="navbar__tagline">Global Stone Export</span>
      </span>
    </a>

    <div class="navbar__links">
      @for (link of navLinks; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="nav-link--active"
          [routerLinkActiveOptions]="link.exact ? { exact: true } : undefined"
          class="nav-link nav-link--light"
        >
          {{ link.label }}
        </a>
      }
    </div>

    <a routerLink="/contact" class="btn-cta-copper navbar__cta navbar__cta--desktop">Request Quote</a>
    <a routerLink="/contact" class="btn-cta-copper navbar__cta navbar__cta--mobile">Quote</a>
  </nav>
</header>
