AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: "Iconic Stones lead capture \u2014 free-tier serverless (Lambda + HTTP\
  \ API + DynamoDB + SES)"
Parameters:
  FromEmail:
    Type: String
    Description: Verified SES sender (must match a verified identity in this region)
    Default: info@theiconicstones.com
  RecipientEmail:
    Type: String
    Description: Inbox that receives lead notification emails
    Default: info@theiconicstones.com
Globals:
  Function:
    Timeout: 10
    MemorySize: 128
    Runtime: nodejs18.x
  HttpApi:
    CorsConfiguration:
      AllowMethods:
      - POST
      - OPTIONS
      AllowHeaders:
      - Content-Type
      AllowOrigins:
      - '*'
Resources:
  LeadsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: marble-granite-leads
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: leadId
        AttributeType: S
      KeySchema:
      - AttributeName: leadId
        KeyType: HASH
  LeadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: marble-granite-lead
      Handler: index.handler
      CodeUri: LeadFunction
      Environment:
        Variables:
          LEADS_TABLE:
            Ref: LeadsTable
          FROM_EMAIL:
            Ref: FromEmail
          RECIPIENT_EMAIL:
            Ref: RecipientEmail
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: LeadsTable
      - Statement:
          Effect: Allow
          Action:
          - ses:SendEmail
          - ses:SendRawEmail
          Resource:
            Fn::Sub: arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${FromEmail}
      Events:
        LeadApi:
          Type: HttpApi
          Properties:
            Path: /lead
            Method: POST
        LeadOptionsApi:
          Type: HttpApi
          Properties:
            Path: /lead
            Method: OPTIONS
    Metadata:
      SamResourceId: LeadFunction
Outputs:
  LeadApiBaseUrl:
    Description: Set apiBaseUrl in src/environments/environment.production.ts to this
      value (no trailing slash)
    Value:
      Fn::Sub: https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com
  LeadsTableName:
    Description: DynamoDB table storing submitted leads
    Value:
      Ref: LeadsTable
